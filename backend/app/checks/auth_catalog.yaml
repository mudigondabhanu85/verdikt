# Auth agent's deterministic check catalog (§3, A07 Authentication
# Failures). No LLM needed — these are all binary, deterministic checks,
# same "narrative in config, logic in code" split as the Phase 1 catalog.
#
# session-not-invalidated-on-logout moved out of here to
# session_invalidation_catalog.yaml — app.agents.session_invalidation's
# SessionInvalidationAgent is the sole implementation now (it uses a
# disposable session so it can't break other agents' shared session
# mid-scan, and confirms via two independent login/logout cycles against
# a real anonymous-visitor baseline, both stronger than this agent's old
# single-shared-session check).

- id: jwt-alg-none
  title: "JWT Issued With \"none\" Signing Algorithm"
  owasp_2025_category: "A07 Authentication Failures"
  cwe_id: "CWE-347"
  severity: "Critical"
  cvss_vector: "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
  cvss_score: 9.1
  portswigger_reference_url: "https://portswigger.net/web-security/jwt"
  plain_language_summary: >
    The session token issued by this application is a JWT that is not
    cryptographically signed, meaning anyone could forge a valid-looking
    token for any user without knowing any secret.
  technical_description: >
    The JWT issued at {url} has "alg": "none" in its header. Tokens using
    this algorithm carry no signature at all, so their claims (including
    the user identity) cannot be trusted or verified.
  remediation: >
    Configure the JWT library to only issue and accept tokens signed with
    a strong algorithm (e.g. RS256 or HS256 with a properly managed
    secret), and explicitly reject "none" on verification.
  references:
    - "https://cwe.mitre.org/data/definitions/347.html"

- id: jwt-missing-expiration
  title: "JWT Issued Without an Expiration Claim"
  owasp_2025_category: "A07 Authentication Failures"
  cwe_id: "CWE-613"
  severity: "Medium"
  cvss_vector: "AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N"
  cvss_score: 5.4
  portswigger_reference_url: "https://portswigger.net/web-security/jwt"
  plain_language_summary: >
    The session token issued by this application never expires, so a
    stolen token would remain valid indefinitely instead of expiring after
    a reasonable time.
  technical_description: >
    The JWT issued at {url} has no "exp" (expiration) claim, so it does
    not naturally expire — a captured token remains valid forever unless
    separately revoked.
  remediation: >
    Set a reasonable "exp" claim on every issued JWT (e.g. 15–60 minutes
    for access tokens, with a separate refresh-token flow for longer
    sessions).
  references:
    - "https://cwe.mitre.org/data/definitions/613.html"

- id: jwt-alg-confusion
  title: "JWT Algorithm Confusion (RS256 to HS256) Accepted"
  owasp_2025_category: "A07 Authentication Failures"
  cwe_id: "CWE-347"
  severity: "Critical"
  cvss_vector: "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
  cvss_score: 9.8
  portswigger_reference_url: "https://portswigger.net/web-security/jwt/algorithm-confusion"
  plain_language_summary: >
    This application accepted a forged session token that was re-signed
    using its own public key as if it were a shared secret, instead of
    properly verifying it with that public key. This lets an attacker
    forge a valid-looking session token for any user, including an
    administrator, without knowing any real secret.
  technical_description: >
    A JWT originally signed with an asymmetric algorithm (RS256) was
    re-signed using HS256 with the server's own published RSA public key
    (from {jwks_url}) used as the HMAC secret, then submitted to {url} —
    and was accepted as valid. This indicates the server's JWT
    verification logic trusts the algorithm specified in the token's own
    header rather than enforcing the expected algorithm.
  remediation: >
    Explicitly pin the expected signing algorithm when verifying JWTs
    (e.g. algorithms=["RS256"], never derived from the token itself), and
    never allow the same key material to be used for both asymmetric
    signing and HMAC verification.
  references:
    - "https://cwe.mitre.org/data/definitions/347.html"

- id: jwt-weak-signing-secret
  title: "JWT Signed With a Weak, Guessable Secret"
  owasp_2025_category: "A07 Authentication Failures"
  cwe_id: "CWE-330"
  severity: "Critical"
  cvss_vector: "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
  cvss_score: 9.8
  portswigger_reference_url: "https://portswigger.net/web-security/jwt/jwt-attacks#brute-forcing-secret-keys"
  plain_language_summary: >
    The secret key used to sign this application's session tokens is a
    common, guessable value. Anyone who can guess it can forge a valid
    session token for any user, including an administrator.
  technical_description: >
    The JWT issued at {url} was successfully verified using a well-known
    weak secret ({matched_secret_hint}) from a small standard wordlist,
    confirming the server's actual HMAC signing secret is guessable.
  remediation: >
    Generate the JWT signing secret using a cryptographically secure
    random generator with at least 256 bits of entropy, store it outside
    source control, and rotate it immediately since it may already be
    compromised.
  references:
    - "https://cwe.mitre.org/data/definitions/330.html"

- id: weak-session-token-entropy
  title: "Session Token Has Low Entropy"
  owasp_2025_category: "A07 Authentication Failures"
  cwe_id: "CWE-330"
  severity: "Medium"
  cvss_vector: "AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N"
  cvss_score: 6.5
  portswigger_reference_url: "https://portswigger.net/web-security/authentication/other-mechanisms"
  plain_language_summary: >
    The session token issued by this application is short and/or
    predictable, which could make it feasible for an attacker to guess a
    valid session belonging to another user.
  technical_description: >
    The session token issued at {url} is {token_length} characters long
    and/or matches a predictable pattern ({pattern_note}), well below what
    is generally considered a securely random session identifier.
  remediation: >
    Generate session tokens using a cryptographically secure random
    generator with at least 128 bits of entropy (e.g. 32+ random bytes,
    base64/hex encoded).
  references:
    - "https://cwe.mitre.org/data/definitions/330.html"
