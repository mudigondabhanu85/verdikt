# Weak Password Policy agent's check catalog. Fully deterministic — no
# LLM anywhere in this path: "did a real re-login with the new password
# succeed" is ground truth, not a judgment call an AI verdict could add
# any value on top of.

- id: weak-password-policy-accepted
  title: "Weak Password Policy — No Minimum Complexity Enforced"
  owasp_2025_category: "A07 Identification and Authentication Failures"
  cwe_id: "CWE-521"
  severity: "Medium"
  cvss_vector: "AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N"
  cvss_score: 4.3
  portswigger_reference_url: "https://portswigger.net/web-security/authentication/password-based"
  plain_language_summary: >
    This account's change-password form accepted a brand-new password
    that was only a single character long, with no minimum length or
    complexity requirement enforced. Weak, easily-guessed or brute-forced
    passwords make credential-stuffing and brute-force attacks far more
    likely to succeed against real user accounts.
  technical_description: >
    Submitting a one-character new password to the change-password form
    at {url} was accepted by the server, and a fresh login with that new
    password succeeded — confirmed by actually re-authenticating with it,
    not by trusting the change-password response alone. No server-side
    minimum length or complexity check rejected the weak value.
  remediation: >
    Enforce a minimum password length (NIST 800-63B recommends at least
    8 characters, with no arbitrary complexity-composition rules that
    push users toward predictable patterns) and check new passwords
    against a breached-password list (e.g. HaveIBeenPwned's k-anonymity
    API) before accepting a password change.
  references:
    - "https://cwe.mitre.org/data/definitions/521.html"
    - "https://pages.nist.gov/800-63-3/sp800-63b.html"
