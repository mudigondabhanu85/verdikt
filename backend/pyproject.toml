[project]
name = "verdikt-backend"
version = "0.1.0"
description = "Verdikt — AI multi-agent web/API security testing platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
