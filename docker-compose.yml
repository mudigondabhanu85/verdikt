services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verdikt
      POSTGRES_PASSWORD: verdikt
      POSTGRES_DB: verdikt
    ports:
      # Host-side port only, for optional direct psql/GUI access — the
      # backend always talks to this over the internal docker network
      # via db:5432 regardless of this mapping. Not 5432:5432: a native
      # Postgres already listening on the host's 5432 (common on dev
      # machines) would make the container fail to bind that port at
      # all, which otherwise breaks `docker compose up` outright with
      # nothing about the failure pointing at "something else already
      # owns this port."
      - "5433:5432"
    volumes:
      - verdikt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdikt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://verdikt:verdikt@db:5432/verdikt
      JWT_SECRET: dev-only-change-me-to-something-random-and-32-bytes-plus
      VAULT_MASTER_KEY: dev-only-insecure-fernet-key-000000000000=
      # Must match the frontend service's browser-visible origin below
      # (CORS checks the Origin header the browser actually sends, not
      # any container-internal address) — see app/config.py.
      FRONTEND_ORIGIN: http://localhost:5173
      # Matches the read-only bind mount below — app/config.py's default
      # ("../browser-extension") only resolves correctly when uvicorn
      # runs with backend/ as its cwd (true for local dev, not true
      # inside this container, which only ever bind-mounts ./backend).
      BROWSER_EXTENSION_SOURCE_DIR: /browser-extension
    ports:
      # Host-side port only — container still listens on 8000 internally
      # (see the healthcheck/command below and frontend's
      # VITE_API_BASE_URL, which must match this host-side value since
      # the browser talks to the host, not the container network).
      # Changed from 8000 because something else on this machine already
      # owns host port 8000.
      - "8095:8000"
      # noVNC/websockify (start-display.sh) — lets the frontend stream
      # the login-macro recorder's headed browser into the analyst's own
      # tab, no browser extension or local display needed. Bound to
      # 127.0.0.1 only, not "6080:6080" (all-interfaces) — x11vnc runs
      # with -nopw, so this must never be reachable from the network,
      # only from the analyst's own machine.
      - "127.0.0.1:6080:6080"
    volumes:
      - ./backend:/app
      # Masks the container's own image-built (Linux) .venv from the
      # bind mount above — without this, mounting the host's ./backend
      # over /app replaces it with the *host's* .venv (macOS/ARM in
      # dev), which is binary-incompatible with the container and
      # breaks every C-extension dependency (psycopg, cryptography,
      # Playwright's browser binaries) the moment the container starts.
      # Same pattern as the frontend service's node_modules mask below.
      - backend_venv:/app/.venv
      # Source for the "Download extension" button next to Record macro
      # (app/api/routes/browser_extension.py zips this on demand) —
      # browser-extension/ is a sibling of backend/, not inside it, so
      # it needs its own mount; ./backend:/app above doesn't reach it.
      - ./browser-extension:/browser-extension:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Runs pending migrations before serving — a fresh `docker compose
    # up` against an empty Postgres volume had no tables at all
    # otherwise (nothing anywhere ran `alembic upgrade head`), so every
    # request failed. `alembic upgrade head` is a no-op once already
    # current, so this is safe to run on every container start/restart,
    # not just the first one. --loop asyncio: uvicorn's default
    # auto-selects uvloop, which is incompatible with Playwright's async
    # browser launch (hangs forever instead of erroring) — see
    # backend/Dockerfile for the full explanation.
    command: >
      sh -c "sh scripts/start-display.sh &&
             uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --loop asyncio"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Browser-visible backend address — the frontend container's own
      # network namespace is irrelevant here, this runs in the user's
      # browser on the host.
      VITE_API_BASE_URL: http://localhost:8095
      # Where the login-macro recorder's live VNC-in-browser view loads
      # from — see backend's 127.0.0.1:6080 port mapping above.
      VITE_VNC_BASE_URL: http://localhost:6080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  verdikt_pgdata:
  backend_venv:
